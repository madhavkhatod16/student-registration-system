<!doctype html>
<html>
<head>
    <title>Student Form</title>
    <style>
        .formBox {
            height: auto;
            width: 500px;
            border: 1px solid black;
            background: white;
            margin: 30px auto;
            border-radius: 15px;
            padding: 25px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="formBox">
        <h2>Student Registration</h2>
        <form id="studentForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone No:</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Select Course / Batch:</label>
                <select id="course" required>
                    <option value="" disabled selected>Select Branch</option>
                    <option value="CSE">CSE</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Chemical">Chemical</option>
                </select>
            </div>
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

    <script>
        class Student {
            constructor(name, email, phone, course) {
                this.id = Date.now();
                this.name = name;
                this.email = email;
                this.phone = phone;
                this.course = course;
                this.contacted = false;
            }
           save() {
                let students = JSON.parse(localStorage.getItem('myStudents')) || [];
                students.push(this);
                localStorage.setItem('myStudents', JSON.stringify(students));
            }
        }

        document.getElementById('studentForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const course = document.getElementById('course').value;

            const newStudent = new Student(name, email, phone, course);
            newStudent.save();

            alert('Registration Successful!');
            e.target.reset();

        });
    </script>
</body>
</html>
